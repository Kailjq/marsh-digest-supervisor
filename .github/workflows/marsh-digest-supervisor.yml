name: marsh-digest-supervisor
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/marsh-digest-supervisor.yml'
      - 'marsh-digest-supervisor.js'
      - 'package.json'

jobs:
  preflight_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Dependencies & Syntax
        run: |
          node -v
          npm -v
          echo "Preflight check passed. Launching distributed execution matrix..."

  parallel_execution:
    needs: [preflight_check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2022
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@152.232.4.64:8235"
        - os: ubuntu-22.04
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@202.155.186.127:6538"
        - os: ubuntu-24.04
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@119.42.39.148:5776"
        - os: ubuntu-latest
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@104.239.20.30:6105"
        - os: windows-2025
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@64.137.108.121:5714"
        - os: ubuntu-20.04
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@82.22.253.210:8068"
        - os: windows-latest
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@67.227.42.169:6146"
        - os: ubuntu-20.04
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@188.68.1.245:6114"
        - os: ubuntu-22.04
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@192.241.116.45:5815"
        - os: windows-2025
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@92.112.137.242:6185"
        - os: windows-latest
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@46.203.228.80:9081"
        - os: ubuntu-24.04
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@136.0.126.245:6006"
        - os: windows-2022
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@198.20.185.230:5600"
        - os: ubuntu-latest
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@31.58.30.55:6637"
        - os: ubuntu-20.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@82.23.204.218:7050"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.runtime == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Task (Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun install
            bun run marsh-digest-supervisor.js "${{ matrix.proxy }}" || true
          else
            npm install
            node marsh-digest-supervisor.js "${{ matrix.proxy }}" || true
          fi

      - name: Run Task (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.runtime }}" -eq "bun") {
            bun install
            bun run marsh-digest-supervisor.js "${{ matrix.proxy }}"
          } else {
            npm install
            node marsh-digest-supervisor.js "${{ matrix.proxy }}"
          }

  pipeline_summary:
    needs: [parallel_execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Log Execution Summary
        run: |
          echo "Pipeline marsh-digest-supervisor finished execution at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Status: ${{ job.status }}"
