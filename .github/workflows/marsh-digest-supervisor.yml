name: marsh-digest-supervisor
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/marsh-digest-supervisor.yml'
      - 'marsh-digest-supervisor.js'
      - 'package.json'

jobs:
  preflight_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Dependencies & Syntax
        run: |
          node -v
          npm -v
          echo "Preflight check passed. Launching distributed execution matrix..."

  parallel_execution:
    needs: [preflight_check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-22.04
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@45.38.89.78:6013"
        - os: windows-latest
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@184.174.25.28:5917"
        - os: ubuntu-20.04
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@104.253.155.107:5523"
        - os: windows-2025
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@67.227.42.169:6146"
        - os: ubuntu-24.04
          runtime: node
          version: '24'
          proxy: "socks5://undefined:undefined@:undefined"
        - os: ubuntu-latest
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@103.251.223.209:6188"
        - os: windows-2022
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@82.22.209.181:6011"
        - os: ubuntu-24.04
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@104.239.20.30:6105"
        - os: ubuntu-20.04
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@202.155.186.127:6538"
        - os: windows-latest
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@46.202.224.240:5792"
        - os: ubuntu-latest
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@206.127.212.253:6231"
        - os: windows-2022
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@64.137.108.121:5714"
        - os: windows-2025
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@204.93.187.250:8260"
        - os: ubuntu-22.04
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@46.202.224.233:5785"
        - os: ubuntu-latest
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@195.40.70.40:6723"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.runtime == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Task (Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun install
            bun run marsh-digest-supervisor.js "${{ matrix.proxy }}" || true
          else
            npm install
            node marsh-digest-supervisor.js "${{ matrix.proxy }}" || true
          fi

      - name: Run Task (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.runtime }}" -eq "bun") {
            bun install
            bun run marsh-digest-supervisor.js "${{ matrix.proxy }}"
          } else {
            npm install
            node marsh-digest-supervisor.js "${{ matrix.proxy }}"
          }

  pipeline_summary:
    needs: [parallel_execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Log Execution Summary
        run: |
          echo "Pipeline marsh-digest-supervisor finished execution at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Status: ${{ job.status }}"
