name: marsh-digest-supervisor
on:
  push:
    branches: [ "main" ]
    paths:
      - '.github/workflows/marsh-digest-supervisor.yml'
      - 'marsh-digest-supervisor.js'
      - 'package.json'

jobs:
  preflight_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Dependencies & Syntax
        run: |
          node -v
          npm -v
          echo "Preflight check passed. Launching distributed execution matrix..."

  parallel_execution:
    needs: [preflight_check]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: windows-2025
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@152.232.4.64:8235"
        - os: ubuntu-20.04
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@151.245.206.161:8156"
        - os: windows-2022
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@104.252.152.108:7021"
        - os: windows-latest
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@82.27.245.13:6336"
        - os: ubuntu-22.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@198.20.185.230:5600"
        - os: ubuntu-24.04
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@107.175.135.139:6580"
        - os: ubuntu-latest
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@195.40.70.40:6723"
        - os: ubuntu-22.04
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@23.27.208.59:5769"
        - os: ubuntu-20.04
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@104.253.55.229:5659"
        - os: windows-latest
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@195.172.135.200:5336"
        - os: ubuntu-24.04
          runtime: node
          version: '22'
          proxy: "socks5://dcswarup:webshare@13.143.125.152:7194"
        - os: windows-2022
          runtime: node
          version: '20'
          proxy: "socks5://dcswarup:webshare@64.137.18.11:6205"
        - os: windows-2025
          runtime: node
          version: '18'
          proxy: "socks5://dcswarup:webshare@46.203.228.80:9081"
        - os: ubuntu-latest
          runtime: bun
          version: 'latest'
          proxy: "socks5://dcswarup:webshare@45.61.97.17:6543"
        - os: windows-latest
          runtime: node
          version: '24'
          proxy: "socks5://dcswarup:webshare@64.137.108.121:5714"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: ${{ matrix.runtime == 'node' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: ${{ matrix.runtime == 'bun' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run Task (Linux)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.runtime }}" = "bun" ]; then
            bun install
            bun run marsh-digest-supervisor.js "${{ matrix.proxy }}" || true
          else
            npm install
            node marsh-digest-supervisor.js "${{ matrix.proxy }}" || true
          fi

      - name: Run Task (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ matrix.runtime }}" -eq "bun") {
            bun install
            bun run marsh-digest-supervisor.js "${{ matrix.proxy }}"
          } else {
            npm install
            node marsh-digest-supervisor.js "${{ matrix.proxy }}"
          }

  pipeline_summary:
    needs: [parallel_execution]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Log Execution Summary
        run: |
          echo "Pipeline marsh-digest-supervisor finished execution at $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Status: ${{ job.status }}"
